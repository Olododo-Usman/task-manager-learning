name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_USER: taskuser
      POSTGRES_DB: taskmanager_ci
      POSTGRES_PASSWORD: temporary_ci_password

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for backend and frontend
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 3 --retry-all-errors \
            --max-time 5 \
            http://localhost:4100/ready

          curl --fail --silent --show-error \
            --retry 20 --retry-delay 3 --retry-all-errors \
            --max-time 5 \
            http://localhost:8081/api/tasks

      - name: Test application
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error

          base = "http://localhost:8081"

          with urllib.request.urlopen(base, timeout=10) as response:
              assert response.status == 200
              assert 'id="root"' in response.read().decode()

          def create_task(title):
              request = urllib.request.Request(
                  base + "/api/tasks",
                  data=json.dumps({"title": title}).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              return urllib.request.urlopen(request, timeout=10)

          with create_task("Task created by CI") as response:
              assert response.status == 201
              task = json.load(response)
              assert task["title"] == "Task created by CI"
              assert task["completed"] is False

          with urllib.request.urlopen(
              base + "/api/tasks", timeout=10
          ) as response:
              tasks = json.load(response)
              assert any(item == task for item in tasks)

          try:
              with create_task("") as response:
                  raise AssertionError("Blank title was accepted")
          except urllib.error.HTTPError as error:
              assert error.code == 400

          print("All application checks passed.")
          PY

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Clean up test containers
        if: always()
        run: docker compose down --volumes
